<style>
:root{--bg:#F0F4F6;--sf:#fff;--ink:#112027;--mu:#5B6D75;--ln:#D8E1E5;--br:#0E5E63;--bi:#fff;--bt:#E1F1F2;--p:#1F7A4D;--pb:#DDF1E6;--a:#B3261E;--ab:#FADEDB;--l:#8A5A00;--lb:#FBEBC8;--e:#2F5DA8;--eb:#DFE8F7;--sh:0 1px 3px rgba(17,32,39,.1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D171C;--sf:#15242B;--ink:#E8F0F3;--mu:#9CB0B8;--ln:#28393F;--br:#52B8BD;--bi:#08262A;--bt:#16353A;--p:#6FD3A0;--pb:#173A2A;--a:#FF9F97;--ab:#43201E;--l:#F2C265;--lb:#41320F;--e:#8DB4F2;--eb:#1B2D4A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D171C;--sf:#15242B;--ink:#E8F0F3;--mu:#9CB0B8;--ln:#28393F;--br:#52B8BD;--bi:#08262A;--bt:#16353A;--p:#6FD3A0;--pb:#173A2A;--a:#FF9F97;--ab:#43201E;--l:#F2C265;--lb:#41320F;--e:#8DB4F2;--eb:#1B2D4A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--br);outline-offset:2px}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--br);color:var(--bi);padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--bi);color:var(--br);display:grid;place-items:center;font:700 18px "Bricolage Grotesque",serif;flex:none}
.brand b{display:block;font:700 16px/1.15 "Bricolage Grotesque",Georgia,serif}
.brand span{font-size:12px;opacity:.85}
main{padding:16px 16px calc(150px + env(safe-area-inset-bottom,0px));max-width:1000px;margin:0 auto}
h1{font:700 22px/1.2 "Bricolage Grotesque",Georgia,serif;margin:0 0 2px}
h2{font:700 17px "Bricolage Grotesque",Georgia,serif;margin:0 0 10px}
.mu{color:var(--mu);font-size:13px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav button,.side button{background:none;border:0;cursor:pointer;color:var(--mu)}
.bnav button{flex:1;padding:8px 2px 7px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
.bnav button[aria-current=page]{color:var(--br)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;box-shadow:var(--sh);padding:14px;margin-top:12px}
.ctx{display:grid;grid-template-columns:1fr 1fr;gap:10px}

label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:10px 12px;min-height:44px}
textarea{min-height:110px}
.btn{background:var(--br);color:var(--bi);border:0;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px}

.btn.dg{background:var(--ab);color:var(--a)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.g{flex:1;min-width:140px}
.dt{display:flex;gap:6px}
.dt button{width:44px;flex:none;background:var(--sf);border:1px solid var(--ln);border-radius:9px;cursor:pointer;font-size:18px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;box-shadow:var(--sh)}
.kpi b{display:block;font:700 26px/1.1 "Bricolage Grotesque",serif}
.kpi span{font-size:12px;color:var(--mu)}
.kpi.P b{color:var(--p)}.kpi.A b{color:var(--a)}.kpi.L b{color:var(--l)}
.stu{padding:12px 0;border-top:1px solid var(--ln);display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.stu:first-child{border-top:0}
.av{width:38px;height:38px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.nm small{display:block;font-weight:400;color:var(--mu);font-size:12px}
.mk{display:flex;gap:6px;width:100%}
.mk button{flex:1;min-height:44px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--mu);font-weight:600;font-size:13px;cursor:pointer}
.mk .P.on{background:var(--p);border-color:var(--p);color:var(--bi)}.mk .A.on{background:var(--a);border-color:var(--a);color:var(--bi)}.mk .L.on{background:var(--l);border-color:var(--l);color:var(--bi)}.mk .E.on{background:var(--e);border-color:var(--e);color:var(--bi)}
.pill{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--bg);color:var(--mu);border:1px solid var(--ln)}
.pill.P{background:var(--pb);color:var(--p);border:0}.pill.A{background:var(--ab);color:var(--a);border:0}.pill.L{background:var(--lb);color:var(--l);border:0}.pill.E{background:var(--eb);color:var(--e);border:0}
.save{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--sf);border-top:1px solid var(--ln);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 9px;border-bottom:1px solid var(--ln);text-align:center;white-space:nowrap}
th{color:var(--mu);font-weight:600}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--sf)}
td.P{color:var(--p);background:var(--pb);font-weight:700}td.A{color:var(--a);background:var(--ab);font-weight:700}td.L{color:var(--l);background:var(--lb);font-weight:700}td.E{color:var(--e);background:var(--eb);font-weight:700}
.pg{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;min-width:70px}.pg i{display:block;height:100%;background:var(--p)}
.empty{text-align:center;color:var(--mu);padding:28px 8px}
.lk{background:none;border:0;color:var(--br);font-weight:600;cursor:pointer;padding:0;text-align:left}
.tw{display:flex;gap:6px}.tw button{flex:1}
.bs{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px}
.cap{font-size:13px;color:var(--mu);margin-top:6px;line-height:1.4}.cap b{color:var(--ink)}
.dt .dbtn{width:auto;flex:1;min-height:48px;text-align:left;padding:6px 12px;line-height:1.25;font-size:14px;color:var(--ink);background:var(--bg)}
.dbtn b{display:block;font-size:15px}.dbtn small{display:block;color:var(--mu);font-size:12px}
.cal{margin-top:8px;border:1px solid var(--ln);border-radius:12px;padding:10px;background:var(--sf)}
.cal .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:700;text-align:center}
.cal .hd button{width:40px;height:40px;border-radius:9px;border:1px solid var(--ln);background:var(--bg);cursor:pointer;font-size:18px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cg .w{font-size:12px;color:var(--mu);font-weight:600;padding:4px 0}
.cg .w.sat{color:var(--a)}
.cg button{min-height:46px;border-radius:9px;border:1px solid transparent;background:var(--bg);cursor:pointer;padding:2px;line-height:1.15;font-weight:600}
.cg button small{display:block;font-size:10px;font-weight:400;color:var(--mu)}
.cg button.sat{color:var(--a)}
.cg button.td{border-color:var(--br)}
.cg button.sel{background:var(--br);color:var(--bi)}.cg button.sel small{color:var(--bi)}
.cg button:disabled{opacity:.35;cursor:default}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;font-weight:600;z-index:9}
@media (min-width:900px){
.side{display:flex;flex-direction:column;gap:4px;position:fixed;left:0;top:0;bottom:0;width:236px;background:var(--sf);border-right:1px solid var(--ln);padding:20px 12px}
.side .brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}.side .logo{background:var(--br);color:var(--bi)}
.side button{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:9px;font-weight:600;font-size:15px;text-align:left}
.side button[aria-current=page]{background:var(--bt);color:var(--br)}
.top,.bnav{display:none}
.wrap{margin-left:236px}
main{padding-bottom:110px}
.save{left:236px;bottom:0}
.toast{bottom:90px}
.kpis{grid-template-columns:repeat(5,1fr)}
.ctx{grid-template-columns:1fr 1fr 1fr}.ctx .full{grid-column:auto}
.mk{width:auto}.mk button{flex:none;padding:0 14px}
.stu{flex-wrap:nowrap}
}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg .w{grid-column:1/-1}
img.av{object-fit:cover;background:var(--bg)}
.pf,.pv{border-radius:50%;overflow:hidden;background:var(--bt);color:var(--br);display:grid;place-items:center;font:700 30px "Bricolage Grotesque",serif;flex:none}
.pf{width:96px;height:96px}.pv{width:84px;height:84px}.pf img,.pv img{width:100%;height:100%;object-fit:cover}
@media (min-width:900px){.fg{grid-template-columns:1fr 1fr 1fr}}
@media print{.side,.top,.bnav,.save,.np{display:none!important}.wrap{margin:0}}

<body>
<aside class="side" id="side"></aside>
<div class="wrap">
<header class="top"><div class="logo">U</div><div class="brand"><b>Urlabari Multiple Campus</b><span>Attendance register</span></div><div id="tdy" style="margin-left:auto;text-align:right;font-size:12px;line-height:1.3"></div></header>
<main id="view"></main>
</div>
<div id="bar"></div>
<nav class="bnav" id="bnav" aria-label="Main"></nav>
<div id="toast"></div>
<script>
const PR=[["BA","Bachelor of Arts",["1st Year","2nd Year","3rd Year","4th Year"]],["BBS","Bachelor of Business Studies",["1st Year","2nd Year","3rd Year","4th Year"]],["BED","Bachelor of Education",["1st Year","2nd Year","3rd Year","4th Year"]],["MA","Master of Arts",["1st Year","2nd Year"]],["MED","Master of Education",["1st Year","2nd Year"]],["MBS","Master of Business Studies",["1st Year","2nd Year"]],["Level 11","Level 11 (+2)",["Management","Education","Humanities","Science"]],["Level 12","Level 12 (+2)",["Management","Education","Humanities","Science"]]];
const IC={dash:'<path d="M3 13h8V3H3zM13 21h8v-8h-8zM13 3v6h8V3zM3 21h8v-6H3z"/>',take:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',rep:'<path d="M18 20V10M12 20V4M6 20v-6"/>',set:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>'};
const TABS=[["dash","Home"],["take","Attendance"],["stu","Students"],["rep","Reports"],["set","Settings"]];
const SK="urlabari-attendance-v1";
let db={students:{},att:{}};
try{const r=JSON.parse(localStorage.getItem(SK));if(r&&r.students&&r.att)db=r}catch(e){}
db.subjects=db.subjects||{};db.meta=db.meta||{};db.tch=db.tch||{};
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(db))}catch(e){toast("Storage is full. Copy a backup and remove some photos.")}};
try{const t=localStorage.getItem("urlabari-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
const pd=n=>String(n).padStart(2,"0"),fmt=d=>`${d.getFullYear()}-${pd(d.getMonth()+1)}-${pd(d.getDate())}`;
const TD=fmt(new Date());
const BSD={2080:[31,32,31,32,31,30,30,30,29,29,30,30],2081:[31,31,32,32,31,30,30,30,29,30,30,30],2082:[30,32,31,32,31,30,30,30,29,30,30,30],2083:[31,31,32,31,31,30,30,30,29,30,30,30]};
const BSM=["Baisakh","Jestha","Ashadh","Shrawan","Bhadra","Ashwin","Kartik","Mangsir","Poush","Magh","Falgun","Chaitra"];
const BSN=["बैशाख","जेठ","असार","श्रावण","भदौ","असोज","कार्तिक","मंसिर","पौष","माघ","फागुन","चैत"];
const WDE=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],WDN=["आइतबार","सोमबार","मंगलबार","बुधबार","बिहीबार","शुक्रबार","शनिबार"];
const BS0=Date.UTC(2023,3,14);
const dn=n=>String(n).replace(/\d/g,x=>"०१२३४५६७८९"[x]);
const fu=t=>{const x=new Date(t);return `${x.getUTCFullYear()}-${pd(x.getUTCMonth()+1)}-${pd(x.getUTCDate())}`};
function toBS(iso){const[y,m,d]=iso.split("-").map(Number);let n=Math.round((Date.UTC(y,m-1,d)-BS0)/864e5);if(n<0)return null;for(const yr in BSD){const ms=BSD[yr];for(let i=0;i<12;i++){if(n<ms[i])return{y:+yr,m:i,d:n+1};n-=ms[i]}}return null}
function fromBS(y,m,d){let n=0;for(const yr in BSD){if(+yr===y){for(let i=0;i<m;i++)n+=BSD[yr][i];return fu(BS0+(n+d-1)*864e5)}n+=BSD[yr].reduce((a,b)=>a+b)}return null}
const bsIso=iso=>{const b=toBS(iso);return b?`${b.y}-${pd(b.m+1)}-${pd(b.d)}`:iso};
const bsShort=iso=>{const b=toBS(iso);return b?`${BSM[b.m].slice(0,3)} ${b.d}`:iso.slice(5)};
function bsLabel(iso){const[y,m,d]=iso.split("-").map(Number),w=new Date(Date.UTC(y,m-1,d)).getUTCDay(),b=toBS(iso);return b?`<b>${WDE[w]}, ${b.d} ${BSM[b.m]} ${b.y} BS</b><br>${WDN[w]}, ${dn(b.d)} ${BSN[b.m]} ${dn(b.y)}`:`${WDE[w]} (BS date not available for this date)`}
function setBS(y,m,d){y=+y;m=+m;d=Math.min(+d,BSD[y][m]);const iso=fromBS(y,m,d);if(iso)setDate(iso)}
function calToggle(){S.co=!S.co;const b=toBS(S.date);S.cy=b?b.y:2083;S.cm=b?b.m:0;render()}
function calNav(n){const i=Math.max(0,Math.min(47,(S.cy-2080)*12+S.cm+n));S.cy=2080+Math.floor(i/12);S.cm=i%12;render()}
function calPick(iso){S.co=false;setDate(iso)}
function dcard(){const wk=["आइत","सोम","मंगल","बुध","बिहि","शुक्र","शनि"];
let h=`<div class="full"><label>Date (BS)</label><div class="dt"><button aria-label="Previous day" onclick="shift(-1)">‹</button><button class="dbtn" aria-expanded="${!!S.co}" onclick="calToggle()">${bsLabel(S.date).replace("<br>","<small>")}${bsLabel(S.date).includes("<br>")?"</small>":""}</button><button aria-label="Next day" onclick="shift(1)">›</button></div>`;
if(S.co){const ms=BSD[S.cy][S.cm],[fy,fm,fd]=fromBS(S.cy,S.cm,1).split("-").map(Number),w0=new Date(Date.UTC(fy,fm-1,fd)).getUTCDay();
h+=`<div class="cal"><div class="hd"><button aria-label="Previous month" onclick="calNav(-1)">‹</button><span>${BSN[S.cm]} ${dn(S.cy)}<small style="display:block;font-weight:400;color:var(--mu);font-size:12px">${BSM[S.cm]} ${S.cy}</small></span><button aria-label="Next month" onclick="calNav(1)">›</button></div><div class="cg">${wk.map((x,i)=>`<div class="w ${i===6?"sat":""}">${x}</div>`).join("")}${Array(w0).fill('<span></span>').join("")}`;
for(let d=1;d<=ms;d++){const iso=fromBS(S.cy,S.cm,d),sat=(w0+d-1)%7===6;h+=`<button class="${iso===S.date?"sel ":""}${iso===TD?"td ":""}${sat?"sat":""}" ${iso>TD?"disabled":""} onclick="calPick('${iso}')">${dn(d)}<small>${+iso.slice(8)}</small></button>`}
h+=`</div><div class="tw" style="margin-top:8px"><button class="btn alt" onclick="calPick('${TD}')">Today</button></div></div>`}
return h+`<div class="cap">AD: ${S.date}</div></div>`}
function bsSel(w){const b=toBS(S[w])||{y:2083,m:0,d:1},f=(y,m,d)=>`setRep('${w}',${y},${m},${d})`;
return `<div class="bs"><select aria-label="${w} year" onchange="${f("this.value",b.m,b.d)}">${Object.keys(BSD).map(y=>`<option ${+y===b.y?"selected":""}>${y}</option>`).join("")}</select><select aria-label="${w} month" onchange="${f(b.y,"this.value",b.d)}">${BSM.map((n,i)=>`<option value="${i}" ${i===b.m?"selected":""}>${n}</option>`).join("")}</select><select aria-label="${w} day" onchange="${f(b.y,b.m,"this.value")}">${Array.from({length:BSD[b.y][b.m]},(_,i)=>`<option ${i+1===b.d?"selected":""}>${i+1}</option>`).join("")}</select></div><div class="cap">AD: ${S[w]}</div>`}
function setRep(w,y,m,d){y=+y;m=+m;const iso=fromBS(y,m,Math.min(+d,BSD[y][m]));if(iso){S[w]=iso>TD?TD:iso;S.csv="";render()}}
function dcardOld(){const b=toBS(S.date)||{y:2083,m:0,d:1};const nd=BSD[b.y][b.m];
return `<div class="full"><label>Date (BS and AD)</label><div class="bs"><select aria-label="BS year" onchange="setBS(this.value,${b.m},${b.d})">${Object.keys(BSD).map(y=>`<option ${+y===b.y?"selected":""}>${y}</option>`).join("")}</select><select aria-label="BS month" onchange="setBS(${b.y},this.value,${b.d})">${BSM.map((n,i)=>`<option value="${i}" ${i===b.m?"selected":""}>${n}</option>`).join("")}</select><select aria-label="BS day" onchange="setBS(${b.y},${b.m},this.value)">${Array.from({length:nd},(_,i)=>`<option ${i+1===b.d?"selected":""}>${i+1}</option>`).join("")}</select></div><div class="dt" style="margin-top:8px"><button aria-label="Previous day" onclick="shift(-1)">‹</button><input type="date" aria-label="AD date" value="${S.date}" max="${TD}" onchange="setDate(this.value)"><button aria-label="Next day" onclick="shift(1)">›</button></div><div class="cap">${bsLabel(S.date)}</div></div>`}
const S={tab:"dash",prog:"BA",cls:"1st Year",date:TD,from:TD.slice(0,8)+"01",to:TD,q:"",d:{},del:null,csv:"",json:"",rs:false,xt:"class",xs:true,sub:"",sv:"class",fp:"",pid:null,f:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const K=(p=S.prog,c=S.cls)=>p+"|"+c;
const L=(k=K())=>(db.students[k]||[]).slice().sort((a,b)=>a.roll-b.roll);
const AK=()=>S.sub?K()+"#"+S.sub:K();
const R=(k=AK(),d=S.date)=>(db.att[k]||{})[d]||{};
const P=()=>PR.find(p=>p[0]===S.prog);
const ini=n=>n.split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h};
const av=(n,ph)=>ph?`<img class="av" alt="" src="${ph}">`:`<div class="av" style="background:hsl(${hue(n)} 45% 38%)">${esc(ini(n))}</div>`;
const svg=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const toast=m=>{$("#toast").innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;setTimeout(()=>$("#toast").innerHTML="",2200)};
const keep=f=>{const y=scrollY;f();scrollTo(0,y)};
const pct=c=>{const t=c.P+c.A+c.L;return t?Math.round((c.P+c.L)*100/t):null};

<div class="kpis"><div class="kpi P"><b>${t.P}</b><span>Present</span></div><div class="kpi A"><b>${t.A}</b><span>Absent</span></div><div class="kpi L"><b>${t.L}</b><span>Late</span></div><div class="kpi"><b>${t.E}</b><span>Leave</span></div><div class="kpi"><b>${ds.length}</b><span>Days recorded</span></div></div>

const db_json=()=>JSON.stringify(db);

const FP="Poppins",FK="Kokila",DV=/[\u0900-\u097F]/,MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DEF={np:"उर्लाबारी बहुमुखी क्याम्पस",en:"Urlabari Multiple Campus",addr:"उर्लाबारी, मोरङ, कोशी प्रदेश, नेपाल  |  Urlabari, Morang, Koshi Province, Nepal"};
const meta=()=>({...DEF,...(db.meta||{})});
const FAC={BA:"Humanities",MA:"Humanities",BBS:"Management",MBS:"Management",BED:"Education",MED:"Education"};
const fac=(p,c)=>p.startsWith("Level")?c:FAC[p];
const LV=p=>p.startsWith("Level")?"Higher Secondary (+2)":["BA","BBS","BED"].includes(p)?"Bachelor’s":"Master’s";
const SC={P:["FF1F7A4D","FFDDF1E6"],A:["FFB3261E","FFFADEDB"],L:["FF8A5A00","FFFBEBC8"],E:["FF2F5DA8","FFDFE8F7"]};
const TEAL="FF0E5E63",solid=f=>({type:"pattern",pattern:"solid",fgColor:{argb:f}});
const BD={style:"thin",color:{argb:"FFC9D5DA"}},BR={top:BD,left:BD,right:BD,bottom:BD};
const PS={orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:0,paperSize:9};
const bsNp=iso=>{const b=toBS(iso);return b?`${dn(b.d)} ${BSN[b.m]} ${dn(b.y)}`:iso};
const per=()=>`Period: ${bsNp(S.from)} to ${bsNp(S.to)} BS   |   ${S.from} to ${S.to} AD`;
function rt(t,sz,b,col){const runs=[];let cur=null;
for(const ch of String(t)||" "){const dv=DV.test(ch),neu=/[\s\d\p{P}\p{S}]/u.test(ch),ty=dv?1:(neu&&cur?cur.t:0);
if(!cur||cur.t!==ty){cur={t:ty,s:""};runs.push(cur)}cur.s+=ch}
return{richText:runs.map(r=>({text:r.s,font:{name:r.t?FK:FP,size:r.t?sz+2:sz,bold:!!b,color:{argb:col||"FF112027"}}}))}}
const uniq=(wb,s)=>{s=s.replace(/[\[\]:*?\/\\]/g,"-").slice(0,28);let n=s,i=2;while(wb.getWorksheet(n))n=s.slice(0,25)+" "+i++;return n};
function mid(ws,C,r,v,sz,b,col,fill){ws.mergeCells(r,1,r,C);const c=ws.getCell(r,1);c.value=rt(v,sz,b,col);c.alignment={horizontal:"center",vertical:"middle",wrapText:true};if(fill)c.fill=solid(fill);ws.getRow(r).height=Math.round(sz*1.8)+8}
function heading(ws,C,title,lines){const M=meta();
mid(ws,C,1,M.np,22,true,TEAL);mid(ws,C,2,M.en,16,true);mid(ws,C,3,M.addr,10,false,"FF5B6D75");mid(ws,C,4,title,13,true,"FFFFFFFF",TEAL);
lines.forEach((l,i)=>mid(ws,C,5+i,l,11,false,"FF112027","FFE1F1F2"));return 5+lines.length}
function hcell(ws,r,i,v){const c=ws.getCell(r,i);c.value=rt(v,10,true,"FFFFFFFF");c.fill=solid(TEAL);c.alignment={horizontal:"center",vertical:"middle",wrapText:true};c.border=BR}
function stat(p,c,sub){const k=K(p,c),ak=sub?k+"#"+sub:k,st=L(k),ds=dates(ak,S.from,S.to);if(!st.length||!ds.length)return null;
const tot={P:0,A:0,L:0,E:0};st.forEach(s=>{const t=tally(ak,s.id,ds);for(const x in t)tot[x]+=t[x]});
return{p,c,sub,ak,st,ds,n:st.length,avg:pct(tot)??0,low:st.filter(s=>(pct(tally(ak,s.id,ds))??100)<75).length}}
function sheet(wb,s){const{p,c,sub,ak,st,ds}=s,n=ds.length,C=n+7,pr=PR.find(x=>x[0]===p);
const ws=wb.addWorksheet(uniq(wb,p+" "+c+(sub?" - "+sub:"")),{views:[{state:"frozen",xSplit:2}],pageSetup:PS});
let r=heading(ws,C,"Attendance Report  |  उपस्थिति प्रतिवेदन",[`Level: ${LV(p)}   |   Program: ${p} – ${pr[1]}`,`Faculty: ${fac(p,c)}${tn("fac:"+fac(p,c),"Coordinator")}   |   Class: ${c}${tn(K(p,c),"Class teacher")}`,`Subject: ${sub||"Daily attendance (whole class)"}${sub?tn(K(p,c)+"#"+sub,"Teacher"):""}`,per()])+1;
const H=["Roll","Student Name",...ds.map(d=>{const b=toBS(d),a=new Date(d+"T00:00:00Z");return(b?`${dn(b.d)} ${BSN[b.m]}`:d.slice(5))+"\n"+a.getUTCDate()+" "+MON[a.getUTCMonth()]}),"Present","Absent","Late","Leave","Attendance %"];
H.forEach((h,i)=>hcell(ws,r,i+1,h));ws.getRow(r).height=42;const hr=r;
const l1=ws.getColumn(3).letter,l2=ws.getColumn(2+n).letter,lp=ws.getColumn(3+n).letter,la=ws.getColumn(4+n).letter,ll=ws.getColumn(5+n).letter;
st.forEach(s0=>{r++;ws.getRow(r).height=21;
let c0=ws.getCell(r,1);c0.value=s0.roll;c0.font={name:FP,size:10};c0.alignment={horizontal:"center",vertical:"middle"};c0.border=BR;
c0=ws.getCell(r,2);c0.value=rt(s0.name,10,false);c0.alignment={vertical:"middle"};c0.border=BR;
const t=tally(ak,s0.id,ds);
ds.forEach((d,j)=>{const v=((db.att[ak]||{})[d]||{})[s0.id]||"",cc=ws.getCell(r,3+j),col=SC[v];cc.value=v||"–";cc.font={name:FP,size:10,bold:!!v,color:{argb:col?col[0]:"FF9AA9B0"}};if(col)cc.fill=solid(col[1]);cc.alignment={horizontal:"center",vertical:"middle"};cc.border=BR});
["P","A","L","E"].forEach((x,j)=>{const cc=ws.getCell(r,3+n+j);cc.value={formula:`COUNTIF(${l1}${r}:${l2}${r},"${x}")`,result:t[x]};cc.font={name:FP,size:10};cc.alignment={horizontal:"center",vertical:"middle"};cc.border=BR});
const pc=pct(t)||0,cp=ws.getCell(r,7+n);cp.value={formula:`IFERROR(ROUND((${lp}${r}+${ll}${r})/(${lp}${r}+${la}${r}+${ll}${r})*100,0),0)`,result:pc};
cp.numFmt='0"%"';cp.font={name:FP,size:10,bold:true,color:{argb:pc<75?SC.A[0]:SC.P[0]}};cp.fill=solid(pc<75?SC.A[1]:SC.P[1]);cp.alignment={horizontal:"center",vertical:"middle"};cp.border=BR});
const f1=hr+1,f2=hr+st.length;
[["Present (P + L)",x=>x==="P"||x==="L",(cl)=>`COUNTIF(${cl}${f1}:${cl}${f2},"P")+COUNTIF(${cl}${f1}:${cl}${f2},"L")`],["Absent",x=>x==="A",(cl)=>`COUNTIF(${cl}${f1}:${cl}${f2},"A")`]].forEach(([lab,test,fm])=>{r++;
const lc=ws.getCell(r,2);lc.value=rt(lab,10,true);lc.border=BR;lc.fill=solid("FFEEF3F5");ws.getCell(r,1).border=BR;ws.getCell(r,1).fill=solid("FFEEF3F5");
ds.forEach((d,j)=>{const cc=ws.getCell(r,3+j),cl=ws.getColumn(3+j).letter;cc.value={formula:fm(cl),result:st.filter(x=>test(((db.att[ak]||{})[d]||{})[x.id])).length};cc.font={name:FP,size:10,bold:true};cc.alignment={horizontal:"center"};cc.border=BR;cc.fill=solid("FFEEF3F5")})});
r+=2;mid(ws,C,r,`Class average: ${s.avg}%   |   Students below 75%: ${s.low}   |   Days recorded: ${n}   |   Students: ${st.length}`,11,true,TEAL);
r++;mid(ws,C,r,"P = Present, A = Absent, L = Late, E = Leave.  Late counts as present; leave days are left out of the percentage.",9,false,"FF5B6D75");
r++;mid(ws,C,r,`Generated on ${TD} AD (${bsNp(TD)} BS)`,9,false,"FF5B6D75");
ws.getColumn(1).width=7;ws.getColumn(2).width=Math.min(40,Math.max(22,...st.map(x=>x.name.length*1.3)));
for(let j=0;j<n;j++)ws.getColumn(3+j).width=9;for(let j=0;j<4;j++)ws.getColumn(3+n+j).width=10;ws.getColumn(7+n).width=15}
function summary(wb,stats){const ws=wb.addWorksheet("Summary",{pageSetup:PS}),C=9;
let r=heading(ws,C,"Attendance Summary  |  उपस्थिति सारांश",[per()])+1;
["Level","Program","Faculty","Class","Subject","Students","Days recorded","Average %","Below 75%"].forEach((h,i)=>hcell(ws,r,i+1,h));ws.getRow(r).height=28;
stats.forEach(s=>{r++;ws.getRow(r).height=21;[LV(s.p),s.p,fac(s.p,s.c),s.c,s.sub||"Daily (whole class)",s.n,s.ds.length,s.avg,s.low].forEach((v,i)=>{const c=ws.getCell(r,i+1),num=typeof v==="number";
if(num)c.value=v;else c.value=rt(v,10,false);c.font=num?{name:FP,size:10}:c.font;c.alignment={horizontal:i>4?"center":"left",vertical:"middle"};c.border=BR;
if(i===7){c.numFmt='0"%"';c.font={name:FP,size:10,bold:true,color:{argb:v<75?SC.A[0]:SC.P[0]}};c.fill=solid(v<75?SC.A[1]:SC.P[1])}})});
[18,10,16,14,24,11,15,12,12].forEach((w,i)=>ws.getColumn(i+1).width=w)}
async function xl(){
if(typeof ExcelJS==="undefined"){toast("Excel library did not load. Check your internet");return}
const jobs=[],add=(p,c,subs)=>subs.forEach(s=>jobs.push([p,c,s])),so=(p,c)=>S.xs?(db.subjects[K(p,c)]||[]):[];
if(S.xt==="class")add(S.prog,S.cls,[S.sub]);
else if(S.xt==="subj")add(S.prog,S.cls,["",...(db.subjects[K()]||[])]);
else{const f=fac(S.prog,S.cls);PR.forEach(p=>p[2].forEach(c=>{if(S.xt==="all"||(S.xt==="prog"&&p[0]===S.prog)||(S.xt==="fac"&&fac(p[0],c)===f))add(p[0],c,["",...so(p[0],c)])}))}
const stats=jobs.map(j=>stat(...j)).filter(Boolean);
if(!stats.length){toast("No attendance saved for this selection and period");return}
try{const wb=new ExcelJS.Workbook();wb.creator=meta().en;
if(S.xt!=="class"&&stats.length>1)summary(wb,stats);
stats.forEach(s=>sheet(wb,s));
const buf=await wb.xlsx.writeBuffer(),cl=window.claude,dl=cl?await cl.use("downloads"):null;
if(!dl){toast("Downloads are not available in this view");return}
const nm={class:"Class",subj:"Subjects",prog:"Program",fac:"Faculty",all:"Campus"}[S.xt];
await dl.save({filename:`Urlabari-Attendance-${nm}-${bsIso(S.from)}_to_${bsIso(S.to)}.xlsx`,data:new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})});
toast("Excel file saved")}catch(e){toast(e&&e.code==="declined"?"Download cancelled":"Could not create the Excel file")}}
function xcard(){const o=[["class","This class (selected subject or daily)"],["subj","This class: every subject"],["prog","Program or level: all classes"],["fac","Faculty: all classes ("+fac(S.prog,S.cls)+")"],["all","Whole campus: everything"]];
return `<div class="card np"><h2>Download Excel</h2><label for="xt">What to export</label><select id="xt" onchange="S.xt=this.value;render()">${o.map(([v,l])=>`<option value="${v}" ${S.xt===v?"selected":""}>${l}</option>`).join("")}</select>${["prog","fac","all"].includes(S.xt)?`<label style="display:flex;gap:8px;align-items:center;margin:10px 0 0;font-weight:500"><input type="checkbox" style="width:auto;min-height:0" ${S.xs?"checked":""} onchange="S.xs=this.checked"> Add a sheet for each subject too</label>`:""}<p class="mu">Uses the date range above. Several classes give one sheet per class, with a summary sheet first.</p><button class="btn" onclick="xl()">Download Excel (.xlsx)</button></div>`}
const subSel=()=>`<div class="full"><label for="sj">Subject</label><select id="sj" onchange="S.sub=this.value;ld();S.csv='';render()"><option value="">Whole class (daily attendance)</option>${(db.subjects[K()]||[]).map(s=>`<option ${s===S.sub?"selected":""}>${esc(s)}</option>`).join("")}</select></div>`;
function scard(){const sb=db.subjects[K()]||[];return `<div class="card np"><h2>Subjects</h2><p class="mu" style="margin-top:0">Add subjects to take subject-wise attendance and export subject-wise reports.</p><div class="row"><div class="g"><label for="sb">Subject name</label><input id="sb" autocomplete="off" placeholder="e.g. Nepali, Accountancy"></div><button class="btn" onclick="addSub()">Add subject</button></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${sb.length?sb.map((s,i)=>`<span class="pill" style="display:inline-flex;gap:4px;align-items:center;padding:2px 4px 2px 12px">${esc(s)}<button class="lk" style="font-size:18px;line-height:1;padding:4px 8px" aria-label="Remove ${esc(s)}" onclick="delSub(${i})">×</button></span>`).join(""):`<span class="mu">No subjects yet.</span>`}</div></div>`}
function addSub(){const v=$("#sb").value.trim();if(!v){toast("Enter a subject name");return}const k=K();db.subjects[k]=db.subjects[k]||[];if(db.subjects[k].includes(v)){toast("Subject already added");return}db.subjects[k].push(v);save();render();toast("Subject added")}
function delSub(i){const k=K(),s=db.subjects[k][i];db.subjects[k].splice(i,1);if(S.sub===s)S.sub="";save();render()}
function mcard(){const M=meta();return `<div class="card"><h2>College details for Excel reports</h2><div style="display:grid;gap:10px"><div><label for="m1">College name (Nepali)</label><input id="m1" value="${esc(M.np)}"></div><div><label for="m2">College name (English)</label><input id="m2" value="${esc(M.en)}"></div><div><label for="m3">Address</label><input id="m3" value="${esc(M.addr)}"></div><div><button class="btn" onclick="saveMeta()">Save details</button></div></div></div>`}
function saveMeta(){db.meta={np:$("#m1").value.trim()||DEF.np,en:$("#m2").value.trim()||DEF.en,addr:$("#m3").value.trim()||DEF.addr};save();toast("Details saved")}
const tn=(key,lab)=>db.tch[key]?`  (${lab}: ${db.tch[key]})`:"";
const blankF=()=>({id:null,roll:Math.max(0,...(db.students[K()]||[]).map(s=>s.roll))+1,name:"",gender:"",dob:"",sphone:"",email:"",guardian:"",phone:"",address:"",regNo:"",photo:""});
function openForm(s){S.f=s?{...s}:blankF();render();scrollTo(0,0)}
function editCur(){const s=(db.students[K()]||[]).find(x=>x.id===S.pid);if(s)openForm(s)}
function openPort(id,p,c){S.prog=p;S.cls=c;S.sub="";ld();S.pid=id;S.f=null;render();scrollTo(0,0)}
const fset=(k,v)=>{S.f[k]=v};
function pickPhoto(inp){const file=inp.files&&inp.files[0];if(!file)return;const rd=new FileReader();
rd.onload=()=>{const img=new Image();img.onload=()=>{const z=140,cv=document.createElement("canvas");cv.width=cv.height=z;const m=Math.min(img.width,img.height);cv.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,z,z);S.f.photo=cv.toDataURL("image/jpeg",.7);render()};img.onerror=()=>toast("Could not read that image");img.src=rd.result};
rd.onerror=()=>toast("Could not read that file");rd.readAsDataURL(file)}
function formHtml(){const f=S.f,E=v=>esc(v==null?"":v);
const I=(k,l,t,ph,w)=>`<div class="${w?"w":""}"><label for="f_${k}">${l}</label><input id="f_${k}" type="${t||"text"}" value="${E(f[k])}" placeholder="${ph||""}" autocomplete="off" oninput="fset('${k}',this.value)"></div>`;
return `<div class="card"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><div class="pv">${f.photo?`<img src="${f.photo}" alt="">`:`<span>${esc(ini(f.name||"?"))}</span>`}</div><div><label class="btn alt" style="display:inline-flex;align-items:center;margin:0;cursor:pointer">${f.photo?"Change photo":"Add photo"}<input type="file" accept="image/*" hidden onchange="pickPhoto(this)"></label>${f.photo?` <button class="lk" onclick="fset('photo','');render()">Remove</button>`:""}<div class="mu" style="margin-top:4px">Optional. The photo is resized and kept in this browser.</div></div></div>
<div class="fg">${I("name","Full name *","text","","w")}${I("roll","Roll no.","number")}<div><label for="f_gender">Gender</label><select id="f_gender" onchange="fset('gender',this.value)">${["","Male","Female","Other"].map(g=>`<option value="${g}" ${f.gender===g?"selected":""}>${g||"Select"}</option>`).join("")}</select></div>${I("dob","Date of birth (BS)","text","e.g. 2062-05-12")}${I("regNo","Registration no.")}${I("sphone","Student phone","tel")}${I("email","Email","email")}${I("guardian","Guardian name")}${I("phone","Guardian phone","tel")}${I("address","Address","text","Ward, municipality, district","w")}</div>
<div class="tw" style="margin-top:14px"><button class="btn" onclick="saveStu(false)">${f.id?"Save changes":"Save student"}</button>${f.id?"":`<button class="btn alt" onclick="saveStu(true)">Save and add another</button>`}<button class="btn alt" onclick="S.f=null;render()">Cancel</button></div></div>`}
function saveStu(again){const f=S.f;f.name=(f.name||"").trim();if(!f.name){toast("Enter the student’s name");return}
const k=K();db.students[k]=db.students[k]||[];const r=parseInt(f.roll,10)||Math.max(0,...db.students[k].map(s=>s.roll))+1;
if(db.students[k].some(s=>s.roll===r&&s.id!==f.id)){toast("Roll "+r+" is already used in this class");return}
const o={...f,roll:r};
if(f.id){db.students[k][db.students[k].findIndex(s=>s.id===f.id)]=o}else{o.id="s"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);db.students[k].push(o)}
save();toast(f.id?"Student updated":"Student added");S.f=f.id||!again?null:blankF();render();scrollTo(0,0)}
function rmStu(){if(S.del!==S.pid){S.del=S.pid;render();return}const k=K();db.students[k]=db.students[k].filter(s=>s.id!==S.pid);
Object.keys(db.att).filter(x=>x===k||x.startsWith(k+"#")).forEach(a=>Object.values(db.att[a]).forEach(d=>delete d[S.pid]));S.pid=null;S.del=null;save();toast("Student removed");render()}
function setT(key,v){v=v.trim();if(v)db.tch[key]=v;else delete db.tch[key];save();toast("Saved")}
function setTS(i,v){const k=K();setT(k+"#"+db.subjects[k][i],v)}
function addSub(){const v=$("#sb").value.trim();if(!v){toast("Enter a subject name");return}const k=K();db.subjects[k]=db.subjects[k]||[];if(db.subjects[k].includes(v)){toast("Subject already added");return}
db.subjects[k].push(v);const t=$("#sbt").value.trim();if(t)db.tch[k+"#"+v]=t;save();render();toast("Subject added")}
function delSub(i){const k=K(),s=db.subjects[k][i];db.subjects[k].splice(i,1);delete db.tch[k+"#"+s];if(S.sub===s)S.sub="";save();render()}
function tcard(){const k=K(),f="fac:"+fac(S.prog,S.cls),sb=db.subjects[k]||[],T=db.tch;
return `<details class="card np"><summary style="cursor:pointer;font-weight:700">Teachers and subjects</summary><div style="margin-top:12px"><div class="fg"><div><label for="t1">Faculty coordinator (${esc(fac(S.prog,S.cls))})</label><input id="t1" value="${esc(T[f]||"")}" onchange="setT('${f}',this.value)"></div><div><label for="t2">Class teacher</label><input id="t2" value="${esc(T[k]||"")}" onchange="setT('${k}',this.value)"></div></div>
<h2 style="margin:16px 0 8px">Subjects</h2>${sb.map((s,i)=>`<div class="row" style="margin-bottom:8px;flex-wrap:nowrap;align-items:center"><div style="flex:1;font-weight:600;overflow-wrap:anywhere">${esc(s)}</div><div style="flex:1.4"><input aria-label="Teacher for ${esc(s)}" placeholder="Subject teacher" value="${esc(T[k+"#"+s]||"")}" onchange="setTS(${i},this.value)"></div><button class="btn alt" style="padding:10px 14px" aria-label="Remove ${esc(s)}" onclick="delSub(${i})">×</button></div>`).join("")}
<div class="row" style="margin-top:8px"><div class="g"><label for="sb">New subject</label><input id="sb" autocomplete="off" placeholder="e.g. Nepali, Accountancy"></div><div class="g"><label for="sbt">Subject teacher</label><input id="sbt" autocomplete="off" placeholder="Optional"></div><button class="btn" onclick="addSub()">Add subject</button></div></div></details>`}
function tline(){const k=K(),a=[],T=db.tch;if(T["fac:"+fac(S.prog,S.cls)])a.push("Faculty coordinator: "+T["fac:"+fac(S.prog,S.cls)]);if(T[k])a.push("Class teacher: "+T[k]);if(S.sub&&T[k+"#"+S.sub])a.push("Subject teacher: "+T[k+"#"+S.sub]);return a.length?`<p class="mu np" style="margin:8px 0 0">${esc(a.join("  ·  "))}</p>`:""}
async function xlStu(all){
if(typeof ExcelJS==="undefined"){toast("Excel library did not load. Check your internet");return}
const it=[];PR.forEach(p=>p[2].forEach(c=>{if(!all&&(p[0]!==S.prog||c!==S.cls))return;L(K(p[0],c)).forEach(s=>it.push({s,p:p[0],c}))}));
if(!it.length){toast("No students to export");return}
try{const wb=new ExcelJS.Workbook();wb.creator=meta().en;
const ws=wb.addWorksheet(all?"All students":uniq(wb,S.prog+" "+S.cls),{pageSetup:PS,views:[{state:"frozen",xSplit:3}]});
const H=["Photo","Roll","Student Name","Gender","Date of Birth (BS)","Program","Faculty","Class","Student Phone","Email","Guardian","Guardian Phone","Address","Reg. No.","Attendance %"],C=H.length;
let r=heading(ws,C,"Student Data  |  विद्यार्थी विवरण",all?[`All programs and classes   |   Total students: ${it.length}`]:[`Level: ${LV(S.prog)}   |   Program: ${S.prog}${tn("fac:"+fac(S.prog,S.cls),"Faculty coordinator")}`,`Faculty: ${fac(S.prog,S.cls)}   |   Class: ${S.cls}${tn(K(),"Class teacher")}   |   Total students: ${it.length}`])+1;
H.forEach((h,i)=>hcell(ws,r,i+1,h));ws.getRow(r).height=30;
it.forEach(({s,p,c})=>{r++;ws.getRow(r).height=s.photo?58:24;const k=K(p,c),pp=pct(tally(k,s.id,dates(k,"0000","9999")));
[null,s.roll,s.name,s.gender,s.dob,p,fac(p,c),c,s.sphone,s.email,s.guardian,s.phone,s.address,s.regNo,pp==null?"":pp].forEach((v,i)=>{const cell=ws.getCell(r,i+1);
if(typeof v==="number"){cell.value=v;cell.font={name:FP,size:10}}else if(v)cell.value=rt(v,10,false);
if(i===14&&v!=="")cell.numFmt='0"%"';cell.alignment={vertical:"middle",horizontal:(i===1||i===14)?"center":"left",wrapText:i===12};cell.border=BR});
if(s.photo){const id=wb.addImage({base64:s.photo,extension:"jpeg"});ws.addImage(id,{tl:{col:0.1,row:r-1+0.05},ext:{width:52,height:52}})}});
[10,7,26,10,16,10,15,14,15,24,22,15,30,12,13].forEach((w,i)=>ws.getColumn(i+1).width=w);
r+=2;mid(ws,C,r,`Generated on ${TD} AD (${bsNp(TD)} BS)`,9,false,"FF5B6D75");
const buf=await wb.xlsx.writeBuffer(),cl=window.claude,dl=cl?await cl.use("downloads"):null;
if(!dl){toast("Downloads are not available in this view");return}
await dl.save({filename:`Urlabari-Students-${all?"All":S.prog+"-"+S.cls}.xlsx`.replace(/\s+/g,"-"),data:new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})});
toast("Excel file saved")}catch(e){toast(e&&e.code==="declined"?"Download cancelled":"Could not create the Excel file")}}
function render(){
const nav=([id,l])=>`<button aria-current="${S.tab===id?"page":"false"}" onclick="go('${id}')">${svg(id)}<span>${l}</span></button>`;
$("#side").innerHTML=`<div class="brand"><div class="logo">U</div><div><b>Urlabari Multiple Campus</b><span class="mu">Attendance register</span></div></div>`+TABS.map(nav).join("");
$("#bnav").innerHTML=TABS.map(nav).join("");
$("#bar").innerHTML="";
$("#view").innerHTML=({dash:vDash,take:vTake,stu:vStu,rep:vRep,set:vSet})[S.tab]();
if(S.tab==="take")fillTake();if(S.tab==="stu")fill()}
ld();render();
$("#tdy").innerHTML=(()=>{const b=toBS(TD);return b?`Today<br><b>${b.d} ${BSM[b.m]} ${b.y}</b>`:""})();
</script>
